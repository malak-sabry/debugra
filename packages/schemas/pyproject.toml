[project]
name = "debugra-schemas"
version = "0.1.0"
description = "Shared data models for Debugra"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["debugra_schemas*"]
