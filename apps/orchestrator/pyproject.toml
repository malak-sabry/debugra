[project]
name = "orchestrator"
version = "0.1.0"
description = "Debugra orchestrator — FastAPI + LangGraph central brain"
requires-python = ">=3.12"
dependencies = [
    "debugra-schemas",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.2.60",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-ollama>=0.2.0",
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "redis[asyncio]>=5.2.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=24.1.0",
    "httpx>=0.28.0",
    "weasyprint>=62.3",
    "jinja2>=3.1.0",
]

[tool.uv.sources]
debugra-schemas = { workspace = true }
