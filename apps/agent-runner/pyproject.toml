[project]
name = "agent-runner"
version = "0.1.0"
description = "Debugra browser agent — Playwright observe→think→act worker"
requires-python = ">=3.12"
dependencies = [
    "debugra-schemas",
    "playwright>=1.49.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-ollama>=0.2.0",
    "python-dotenv>=1.0.0",
    "axe-playwright-python>=0.1.3",
]

[tool.uv.sources]
debugra-schemas = { workspace = true }
