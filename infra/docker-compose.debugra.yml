services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: debugra
      POSTGRES_PASSWORD: debugra
      POSTGRES_DB: debugra
    ports:
      - "5432:5432"
    volumes:
      - debugra_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debugra"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  orchestrator:
    build:
      context: ..
      dockerfile: apps/orchestrator/Dockerfile
    ports:
      - "8000:8000"
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://debugra:debugra@db:5432/debugra
      REDIS_URL: redis://redis:6379/0
      ARTIFACTS_DIR: /app/runs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../runs:/app/runs

  dashboard:
    build:
      context: ..
      dockerfile: apps/dashboard/Dockerfile
      args:
        ORCHESTRATOR_INTERNAL_URL: http://orchestrator:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      ORCHESTRATOR_INTERNAL_URL: http://orchestrator:8000
    depends_on:
      - orchestrator

volumes:
  debugra_pg_data:
